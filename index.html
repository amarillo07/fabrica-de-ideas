<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fábrica de Ideas</title>
<meta name="description" content="Responde 6 preguntas y obtén 10 ideas de negocio, de la más segura a la más atrevida. Funciona sin internet.">
<meta name="theme-color" content="#FFD43B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fábrica de Ideas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<script src="vendor/jspdf.umd.min.js" defer></script>
<style>
:root{
  --sun:#FFD43B; --ink:#1B1905; --ink2:#3A3508; --ink3:#4A4410; --cream:#FFF3A6; --white:#FFFFFF;
  --amber:#FFB000; --orange:#FF8A00; --hot:#FF9A1A; --pale:#FFF7BF; --lime:#F1F06B;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --spring:cubic-bezier(.2,.9,.25,1.12); --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--sun);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left;touch-action:manipulation}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* fondo vivo */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--sun)}
#bg i{position:absolute;display:block;border-radius:50%;will-change:transform}
#bg .b1{width:340px;height:340px;background:var(--pale);top:-110px;left:-90px;filter:blur(40px);animation:drift1 26s ease-in-out infinite alternate}
#bg .b2{width:320px;height:320px;background:var(--hot);top:38%;right:-150px;filter:blur(55px);animation:drift2 32s ease-in-out infinite alternate}
#bg .b3{width:280px;height:280px;background:var(--lime);bottom:-40px;left:-110px;filter:blur(50px);animation:drift1 30s ease-in-out infinite alternate-reverse}
#bg .s1{width:150px;height:150px;background:var(--amber);top:26%;right:18px;animation:drift3 22s ease-in-out infinite alternate}
#bg .s2{width:96px;height:96px;border:18px solid var(--cream);bottom:19%;left:34px;animation:drift2 28s ease-in-out infinite alternate-reverse}
#bg .s3{width:190px;height:44px;border-radius:22px;background:var(--orange);top:61%;left:38%;rotate:-18deg;animation:drift3 34s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(40px,60px) scale(1.08)}}
@keyframes drift2{to{transform:translate(-50px,-40px) scale(.94)}}
@keyframes drift3{to{transform:translate(-26px,48px)}}

/* vidrio */
.g{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -10px 18px rgba(255,255,255,.16),0 12px 30px rgba(120,78,0,.16)}
.c{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(3px) saturate(135%) brightness(1.03);backdrop-filter:blur(3px) saturate(135%) brightness(1.03);border:1px solid rgba(255,255,255,.62);box-shadow:inset 2px 2px 2px rgba(255,255,255,.95),inset -2px -2px 3px rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.22),inset 0 -16px 22px rgba(255,255,255,.2),inset 0 14px 18px rgba(255,255,255,.1),0 12px 28px rgba(120,78,0,.2)}
.cta{background:linear-gradient(180deg,#FFF58A 0%,#FFDA1F 100%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 2px 6px rgba(255,255,255,.95),inset 0 -7px 12px rgba(212,148,0,.38),0 10px 24px rgba(130,84,0,.28)}

/* presión y brillo */
.press{position:relative;overflow:hidden;transition:transform .18s var(--spring),box-shadow .2s,background-color .2s,color .2s,border-color .2s}
.press:active{transform:scale(.955)}
.press::after{content:"";position:absolute;left:var(--px,50%);top:var(--py,50%);width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.press.glint::after{animation:glint .55s var(--ease)}
@keyframes glint{0%{transform:translate(-50%,-50%) scale(0);opacity:.7}100%{transform:translate(-50%,-50%) scale(26);opacity:0}}

/* estructura */
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#2E9E4F;transition:background .3s}
.dot.off{background:#C2410C}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.view{display:flex;flex-direction:column;gap:16px;animation:viewIn .42s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}
.hero h1{font-size:clamp(36px,10.5vw,44px);line-height:1;font-weight:600;letter-spacing:-.03em}
.hero h1.serif{font-size:clamp(38px,11vw,46px);letter-spacing:-.012em}
.hero p{margin-top:8px;font-size:15px;color:var(--ink2)}
.title{font-size:36px;line-height:1.02;font-weight:600;letter-spacing:-.028em}
.title .serif{font-size:40px;letter-spacing:-.01em}

/* preguntas */
.qcard{border-radius:32px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps button{width:22px;height:20px;display:flex;align-items:center}
.steps button::before{content:"";width:100%;height:5px;border-radius:3px;background:rgba(27,25,5,.2);transition:background .3s,transform .3s var(--spring)}
.steps button.done::before{background:rgba(27,25,5,.55)}
.steps button.on::before{background:var(--ink);transform:scaleY(1.5)}
.qbody{display:flex;flex-direction:column;gap:14px;animation:qIn .38s var(--ease)}
@keyframes qIn{from{opacity:0;transform:translateX(var(--dir,18px))}}
.qbody h2{font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-.022em}
.qbody h2 .serif{font-size:29px}
.qbody .hint{font-size:14px;color:var(--ink2);margin-top:-8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 14px;border-radius:22px;background:var(--white);border:1px solid var(--white);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream);font-weight:600;animation:pop .34s var(--spring)}
.chip.add{background:transparent;border:1px dashed rgba(27,25,5,.6);font-weight:600}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;padding:9px 16px;border-radius:20px;background:var(--white);border:1px solid var(--white);display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.opt b{font-size:15px;font-weight:600}
.opt small{font-size:13px;color:var(--ink2);text-align:right}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream);animation:pop .34s var(--spring)}
.opt[aria-pressed="true"] small{color:var(--cream);opacity:.8}
.field{width:100%;height:50px;border-radius:18px;border:1px solid var(--white);background:var(--white);padding:0 16px;font-size:15px}
.field::placeholder{color:#6B6540}
.area{width:100%;min-height:84px;border-radius:18px;border:1px solid var(--white);background:var(--white);padding:12px 16px;font:inherit;font-size:15px;line-height:1.4;color:var(--ink);resize:none;display:block}
.area::placeholder{color:#6B6540}
.more{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;padding:5px;border-radius:27px;gap:4px}
.seg button{flex:1;height:44px;border-radius:22px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center}
.seg button[aria-pressed="true"]{background:var(--white);font-weight:700;box-shadow:0 4px 12px rgba(120,78,0,.16)}
.opt b{overflow-wrap:anywhere}
.row{display:flex;gap:10px}
.row.stick{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:3}
.btn{height:56px;border-radius:28px;padding:0 20px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%}
.btn.big{height:62px;border-radius:31px;font-family:var(--serif);font-size:24px;font-weight:400;flex:1}
.btn.round{width:56px;padding:0;flex:none}
.btn:disabled{pointer-events:none;filter:saturate(.35);color:rgba(27,25,5,.45)}
.btn.dark{background:var(--ink);color:var(--cream)}

/* ideas */
.spec{border-radius:24px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.specbar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.specbar button{height:30px;border-radius:9px;border:2px solid transparent;transition:transform .2s var(--spring)}
.specbar button:active{transform:scale(.86)}
.specleg{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:12px}
.card{border-radius:28px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:cardIn .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms);scroll-margin-top:16px}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}}
.card.swap{animation:swap .5s var(--ease)}
@keyframes swap{0%{transform:rotateX(0)}45%{transform:rotateX(88deg);opacity:.2}100%{transform:rotateX(0)}}
.chead{display:flex;align-items:center;gap:10px}
.cmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border-radius:18px;min-height:48px}
.lv{width:44px;height:44px;border-radius:15px;border:1px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;flex:none}
.ct{min-width:0;display:flex;flex-direction:column;gap:1px}
.ct b{font-size:17px;line-height:1.15;font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere}
.ct small{font-size:13px;color:var(--ink2)}
.bm{width:44px;height:44px;border-radius:50%;background:var(--white);border:1px solid var(--white);display:flex;align-items:center;justify-content:center;flex:none}
.bm svg{transition:fill .2s}
.bm[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.bm[aria-pressed="true"] svg{fill:#FFE04D;stroke:#FFE04D}
.bm.bounce{animation:bounce .5s var(--spring)}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
.selbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
.selbtn[aria-pressed="true"] .check{background:var(--ink);border-color:var(--ink)}
.selbtn[aria-pressed="true"] .check svg{opacity:1;transform:none}
.selbtn .check{background:var(--white)}
.tags{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:600}
.tags span{padding:6px 11px;border-radius:12px;background:var(--white)}
.tags .warn{background:var(--ink);color:var(--cream)}
.empty{border-radius:32px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty h2{font-size:24px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.empty p{color:var(--ink2);font-size:15px}

/* carpetas */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.folder{min-height:158px;border-radius:30px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;animation:cardIn .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 60ms)}
.sw{display:flex;gap:4px;flex-wrap:wrap;min-height:26px}
.sw span{width:26px;height:26px;border-radius:9px}
.folder b{font-size:19px;line-height:1.1;font-weight:700;letter-spacing:-.015em;display:block;overflow-wrap:anywhere}
.folder small{font-size:13px;color:var(--ink2)}
.folder.new{border:2px dashed rgba(27,25,5,.5);background:rgba(255,255,255,.14);align-items:center;justify-content:center;font-size:15px;font-weight:700;gap:8px}
.fhead{display:flex;align-items:center;gap:10px}
.fhead .title{flex:1;min-width:0;font-size:30px;overflow-wrap:anywhere}
.ibtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}

/* barra inferior */
nav{position:fixed;z-index:5;left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(350px,calc(100% - 40px));border-radius:34px;padding:6px;display:flex}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:28px;background:var(--white);box-shadow:0 4px 12px rgba(120,78,0,.18);transition:transform .45s var(--spring)}
nav button{position:relative;flex:1;height:56px;border-radius:28px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .18s var(--spring)}
nav button:active{transform:scale(.93)}
nav button[aria-current="page"]{font-weight:700}
nav button svg{transition:transform .4s var(--spring)}
nav button[aria-current="page"] svg{transform:scale(1.15) rotate(-6deg)}
nav .count{position:absolute;top:2px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--cream);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* hoja de detalle */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(60,40,0,.28);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:11;left:50%;bottom:0;width:min(480px,100%);max-height:92%;translate:-50% 0;transform:translateY(105%);transition:transform .5s var(--spring);border-radius:36px 36px 0 0;overflow-y:auto;overscroll-behavior:contain;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));background:rgba(255,250,225,.86);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 -14px 40px rgba(120,78,0,.25);display:flex;flex-direction:column;gap:14px}
#sheet.open{transform:translateY(0)}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(27,25,5,.25);margin:0 auto}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dname{font-size:34px;line-height:1.02;font-weight:600;letter-spacing:-.028em;overflow-wrap:anywhere}
.dtext{font-size:16px;line-height:1.45}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--white);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.fact b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.block{border-top:1px solid rgba(27,25,5,.16);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.block p{font-size:15px;line-height:1.42}
.step1{background:var(--ink);color:var(--cream);border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.4}
.plan{background:var(--white);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:cardIn .45s var(--ease)}
.plan h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.plan ol,.plan ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.plan .nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.plan .nums div{background:#FFF7CF;border-radius:14px;padding:10px;font-size:13px;color:var(--ink2)}
.plan .nums b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

/* modal */
#modal{position:fixed;z-index:21;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));translate:-50% 0;transform:translateY(120%) scale(.96);transition:transform .45s var(--spring);border-radius:32px;padding:20px;background:rgba(255,252,236,.94);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid #fff;box-shadow:0 20px 50px rgba(90,58,0,.35);display:flex;flex-direction:column;gap:14px;max-height:80%;overflow-y:auto}
#modal.open{transform:none}
#mscrim{z-index:20}
#modal h2{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
#modal p{font-size:15px;color:var(--ink2)}
.frow{min-height:54px;border-radius:18px;background:var(--white);padding:0 14px;display:flex;align-items:center;gap:12px;width:100%;font-size:15px;font-weight:600}
.frow small{font-weight:500;color:var(--ink2);margin-left:auto;font-size:13px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid rgba(27,25,5,.35);display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s,border-color .2s}
.frow[aria-pressed="true"] .check{background:var(--ink);border-color:var(--ink)}
.check svg{opacity:0;transform:scale(.4);transition:all .3s var(--spring)}
.frow[aria-pressed="true"] .check svg{opacity:1;transform:none}

.skel{height:112px;border-radius:28px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink2)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);animation:sweep 1.4s infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.ia{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:8px;background:var(--ink);color:var(--cream);margin-left:6px}
#modal a{color:var(--ink);font-weight:700;overflow-wrap:anywhere}
#modal .note{font-size:13px}
.topr{display:flex;gap:8px;align-items:center}
#toast{position:fixed;z-index:30;left:50%;top:calc(14px + env(safe-area-inset-top,0px));translate:-50% 0;transform:translateY(-160%);transition:transform .5s var(--spring);background:var(--ink);color:var(--cream);font-size:14px;font-weight:600;padding:12px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 26px rgba(60,40,0,.35)}
#toast.open{transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>

<div id="app">
  <div class="top">
    <div class="pill c" role="status"><span class="dot" id="dot"></span><span id="net">Lista sin conexión</span></div>
    <div class="topr"><button class="pill c press" id="installBtn" data-act="install" hidden>Instalar app</button>
    <button class="ibtn c press" data-act="settings" aria-label="Ajustes de IA"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1905" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
  </div>
  <main id="view"></main>
</div>

<nav class="c" aria-label="Secciones">

async function gemini(prompt){
  const models = [...new Set([gmodel, "gemini-flash-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"].filter(Boolean))];

  for (const m of models){

      if (r.status === 404){ last = {code:"red"}; continue; }
      if (!r.ok) throw {code: r.status === 429 ? "limite" : [400, 401, 403].includes(r.status) ? "clave" : "red"};
      const j = await r.json();
      const txt = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || "").join("");

  }
  throw last;
}

/* ---------- PDF ---------- */
function buildPDF(titulo, list){
  const d = new window.jspdf.jsPDF({unit:"pt", format:"letter"}), W = 612, H = 792, M = 48;
  const clean = t => String(t ?? "").replace(/[^\n\x20-\x7E -ÿ–—‘’“”•…]/g, "");
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const INK = [27, 25, 5], SOFT = [74, 68, 16];
  let y = 0;
  const top = () => { d.setFillColor(255, 212, 59); d.rect(0, 0, W, 12, "F"); y = 62; };
  const need = h => { if (y + h > H - 60){ d.addPage(); top(); } };
  const para = (t, size, style, x, color) => {
    d.setFont("helvetica", style); d.setFontSize(size); d.setTextColor(...(color || INK));
    for (const ln of d.splitTextToSize(clean(t), W - M - x)){ need(size * 1.4); d.text(ln, x, y); y += size * 1.4; }
  };
  d.setFillColor(255, 212, 59); d.rect(0, 0, W, 132, "F");
  d.setFont("helvetica", "bold"); d.setFontSize(28); d.setTextColor(...INK); d.text("Fábrica de Ideas", M, 66);
  d.setFont("helvetica", "normal"); d.setFontSize(13); d.text(d.splitTextToSize(clean(titulo), W - 2 * M)[0], M, 92);
  d.setFontSize(10); d.setTextColor(...SOFT);
  d.text(new Date().toLocaleDateString("es-MX", {day:"numeric", month:"long", year:"numeric"}) + "  ·  " + list.filter(x => !x.h).length + (list.filter(x => !x.h).length === 1 ? " idea" : " ideas") + "  ·  cifras en pesos mexicanos", M, 112);
  y = 176;
  list.forEach(it => {
    if (it.h){ need(190); d.setFillColor(255, 243, 166); d.roundedRect(M, y - 20, W - 2 * M, 30, 8, 8, "F"); d.setFont("helvetica", "bold"); d.setFontSize(12); d.setTextColor(...INK); d.text(d.splitTextToSize(clean(it.h), W - 2 * M - 24)[0], M + 12, y); y += 44; return; }
    need(150);
    d.setFillColor(...rgb(LV[it.nivel - 1])); d.roundedRect(M, y - 22, 34, 34, 9, 9, "F");
    d.setFont("helvetica", "bold"); d.setFontSize(16); d.setTextColor(...rgb(lvInk(it.nivel))); d.text(String(it.nivel), M + 17, y + 1, {align:"center"});
    const y0 = y; y = y0 - 8;
    para(it.nombre, 15, "bold", M + 46);
    para(`${it.tipo}  ·  idea ${lvWord(it.nivel)}  ·  riesgo ${it.riesgo}`, 10, "normal", M + 46, SOFT);
    y = Math.max(y, y0 + 24) + 6;
    para(it.desc, 11, "normal", M);
    y += 4; para(`Inversión: ${it.inv}      Primer cobro: ${it.cobro}      Riesgo: ${it.riesgo}`, 10, "bold", M);
    y += 4; para("Ejemplo: " + it.ej, 11, "normal", M);
    para("Primer paso: " + it.paso, 11, "normal", M);
    const mi = metaInfo(it); if (mi) para(`Para tu meta de ${mx(A.meta)} netos al mes: cerca de ${mi.n.toLocaleString("es-MX")} ${it.un}. ${mi.txt}`, 11, "normal", M);
    if (it.plan){
      const pl = it.plan;
      y += 8; para("Plan de 30 días", 11, "bold", M);
      pl.weeks.forEach((w, i) => para(`${i + 1}. ${w}`, 11, "normal", M + 12));
      y += 4; para(`Números: precio ${mx(it.pr)}, costo aproximado ${mx(pl.costo)}, ganancia ${mx(pl.gan)} por venta. Con ${pl.n.toLocaleString("es-MX")} ventas ganas ${mx(pl.meta)} al mes.`, 11, "normal", M);
      para("Nombres posibles: " + pl.names.join(", "), 11, "normal", M);
      para("Mayor riesgo: " + pl.risk, 11, "normal", M);
    }
    y += 8; need(24); d.setDrawColor(232, 222, 170); d.line(M, y, W - M, y); y += 38;
  });
  const n = d.getNumberOfPages();
  for (let i = 1; i <= n; i++){ d.setPage(i); d.setFont("helvetica", "normal"); d.setFontSize(9); d.setTextColor(120, 112, 60); d.text(`Fábrica de Ideas  ·  página ${i} de ${n}`, W / 2, H - 30, {align:"center"}); }
  return d;
}
/*PDF-START*/
async function deliverPDF(d, filename){
  const blob = d.output("blob");
  try {
    const f = new File([blob], filename, {type:"application/pdf"});
    if (navigator.canShare && navigator.canShare({files:[f]}) && matchMedia("(pointer: coarse)").matches){ await navigator.share({files:[f], title:"Fábrica de Ideas"}); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  d.save(filename); toast("PDF descargado");
}

/* ---------- acciones ---------- */
const ACT = {
  tab: el => go(el.dataset.tab),
  goStep: el => { const n = +el.dataset.v; dir = n > step ? 18 : -18; step = n; render(); },
  prev: () => { dir = -18; step--; render(); },
  next: () => {
    if (!stepOk(step)) return;
    if (step < STEPS.length - 1){ dir = 18; step++; render(); window.scrollTo({top:0, behavior:"smooth"}); }
    else { A.gen = "gustos"; runGen(); }
  },
  chip: el => { const k = STEPS[step].key, v = el.dataset.v, i = A[k].indexOf(v); i < 0 ? A[k].push(v) : A[k].splice(i, 1); el.setAttribute("aria-pressed", i < 0); buzz(8); save(); syncNext(); },
  unCustom: el => { const k = STEPS[step].ck; A[k] = A[k].filter(x => x !== el.dataset.v); save(); render(); },
  addCustom: () => { const s = STEPS[step]; askText(s.key === "skills" ? "¿Qué más sabes hacer?" : "¿Qué otra cosa te apasiona?", s.key === "skills" ? "Ej. contabilidad, soldar, inglés" : "Ej. pesca, K-pop, ajedrez", "", "Agregar", v => { if (!A[s.ck].includes(v) && !A[s.key].includes(v)) A[s.ck].push(v); save(); render(); }); },
  addOpt: () => { const k = STEPS[step].key; askText("Tu respuesta", "Escríbela con tus palabras", A.customOpt[k] || "", "Agregar", v => { A.customOpt[k] = v; A[k] = "custom"; save(); render(); }); },
  via: el => { A.via = el.dataset.v; dir = 18; save(); render(); },
  seedEx: el => { A.seed = el.dataset.v; save(); render(); },
  genSeed: () => { if (!A.seed.trim() || loading) return; A.gen = "idea"; runGen(); },
  opt: el => { A[STEPS[step].key] = el.dataset.v; el.parentNode.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", o === el)); buzz(8); save(); syncNext(); },
  open: el => openSheet(el.dataset.id),
  closeSheet, closeModal,
  submitModal: () => modalSubmit && modalSubmit(),
  jump: el => { const c = document.getElementById("c-" + el.dataset.id); c && c.scrollIntoView({behavior:"smooth", block:"start"}); },
  regen: () => { if (!loading) runGen(); },
  pick: el => openModal(pickerHTML(el.dataset.id)),

    if (i >= 0){ f.ideas.splice(i, 1); toast(`Quitada de «${f.name}»`); }

    save(); el.setAttribute("aria-pressed", i < 0); el.querySelector("small").textContent = f.ideas.length; refreshMarks(id);

  },
  newFolderFor: el => { const id = el.dataset.id; askText("Nombre de la carpeta", "Ej. Para empezar ya", "", "Crear", v => { const it = findIdea(id); folders.push({id:uid(), name:v, ideas: it ? [JSON.parse(JSON.stringify(it))] : []}); save(); toast(`Guardada en «${v}»`); buzz(10); refreshMarks(id); if (tab === "carpetas") render(); }); },
  newFolder: () => askText("Nombre de la carpeta", "Ej. Locuras con futuro", "", "Crear", v => { folders.push({id:uid(), name:v, ideas:[]}); save(); render(); }),
  openFolder: el => { sel = null; openFolder = el.dataset.id; render(); window.scrollTo({top:0}); },
  closeFolder: () => { sel = null; openFolder = null; render(); },
  renameFolder: () => { const f = folders.find(x => x.id === openFolder); askText("Cambiar nombre", "Nombre", f.name, "Guardar", v => { f.name = v; save(); render(); }); },
  askDelete: () => { const f = folders.find(x => x.id === openFolder); openModal(`<h2>¿Borrar «${esc(f.name)}»?</h2><p>${f.ideas.length ? `Se borrarán también sus ${f.ideas.length} ideas guardadas.` : "La carpeta está vacía."} No se puede deshacer.</p><div class="row"><button class="btn press" style="flex:1;background:#fff" data-act="closeModal">Cancelar</button><button class="btn dark press" style="flex:1" data-act="doDelete">Borrar carpeta</button></div>`); },
  doDelete: () => { folders = folders.filter(x => x.id !== openFolder); openFolder = null; save(); closeModal(); render(); toast("Carpeta borrada"); },
  develop: () => { const it = findIdea(sheetId); if (!it || busy) return; if (it.plan){ it.plan = null; save(); renderSheet(); return; } askAvoid("develop"); },
  vary: () => { if (!findIdea(sheetId) || busy) return; askAvoid("vary"); },
  avoidChip: el => { const t = $("#avoid"); if (!t) return; const v = el.dataset.v; t.value = t.value.trim() ? (t.value.includes(v) ? t.value : t.value.trim().replace(/[.,;]$/, "") + ", " + v.toLowerCase()) : v; },
  goAvoid: el => { A.avoid = $("#avoid").value.trim(); save(); const k = el.dataset.kind; closeModal(); k === "develop" ? ACT.doDevelop() : ACT.doVary(); },
  doDevelop: async () => {
    const it = findIdea(sheetId); if (!it || busy) return;
    if (it.plan){ it.plan = null; save(); renderSheet(); return; }
    const plan = planFor(it);
    if (aiOn()){
      busy = "develop"; renderSheet();
      try {
        const o = await gemini(`${RULES}\nDesarrolla esta idea de negocio para la persona del perfil.${avoidTxt()}\nIDEA: ${it.nombre}. ${it.desc} Inversión: ${it.inv}. Precio por venta: ${mx(it.pr)}.\n\nPERFIL\n${perfil()}\n\nResponde solo con un objeto JSON: {"weeks":["semana 1","semana 2","semana 3","semana 4"],"names":["nombre 1","nombre 2","nombre 3"],"risk":"el mayor riesgo y cómo evitarlo, en 1 o 2 frases"}\nCada semana es una acción concreta de una frase.`);
        if (Array.isArray(o.weeks) && o.weeks.length >= 3) plan.weeks = o.weeks.slice(0, 4).map(x => String(x).slice(0, 260));
        if (Array.isArray(o.names) && o.names.length) plan.names = o.names.slice(0, 3).map(x => String(x).slice(0, 60));
        if (o.risk) plan.risk = String(o.risk).slice(0, 320);
      } catch(e){ toast(AIERR[(e && e.code) || "red"] + " Usé el plan básico."); }
      busy = "";
    }
    it.plan = plan; save();
    if (sheetId === it.id){ renderSheet(); setTimeout(() => { const p = $("#sheet .plan"); p && p.scrollIntoView({behavior:"smooth", block:"start"}); }, 60); }
  },
  doVary: async () => {
    const old = findIdea(sheetId); if (!old || busy) return;
    let nu = null;
    if (aiOn()){
      busy = "vary"; renderSheet();
      try {
        const o = await gemini(`${RULES}\nPropón UNA idea de negocio nueva y distinta a "${old.nombre}", con el mismo nivel de atrevimiento: ${old.nivel} de 10 (1 es lo más seguro, 10 lo más único).${avoidTxt()}\n\nPERFIL\n${perfil()}\n\nResponde solo con un objeto JSON con esta forma:\n${FORM}`);
        nu = fromAI(Array.isArray(o) ? o[0] : o, old.nivel);
      } catch(e){ toast(AIERR[(e && e.code) || "red"] + " Usé el generador propio."); }
      busy = "";
    }
    const viaIA = !!nu;
    if (!nu) nu = makeIdea(old.nivel, [old.nombre]);
    const i = ideas.findIndex(x => x.id === old.id);
    if (i >= 0){ ideas[i] = nu; } else { ideas = ideas.filter(x => x.nivel !== nu.nivel).concat(nu).sort((x, y) => x.nivel - y.nivel); }
    save(); buzz(12);
    if (sheetId === old.id){
      sheetId = nu.id; renderSheet(); $("#sheet").scrollTop = 0;
      $("#sheet").animate([{transform:"translateY(0) scale(1)"},{transform:"translateY(10px) scale(.975)"},{transform:"translateY(0) scale(1)"}], {duration:420, easing:"cubic-bezier(.2,.9,.25,1.12)"});
    }
    if (tab !== "carpetas") render();
    if (viaIA || !aiOn()) toast("Nueva versión de la idea");
  },
  settings: () => openModal(`<h2>Ideas con IA gratis</h2>
    <p>Con una clave de Google Gemini, la app usa IA cuando hay internet. Sin internet sigue el generador propio.</p>
    <p class="note">Consigue tu clave gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Se guarda solo en este teléfono. En el nivel gratuito, Google usa lo que envías para mejorar sus productos.</p>
    <input class="field" id="kInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pega aquí tu clave" value="${esc(gkey)}" aria-label="Clave de Gemini" style="background:#fff;border-color:rgba(27,25,5,.2)">
    <p id="kMsg" role="status"><strong>${gkey ? "IA activada." : "IA apagada."}</strong></p>
    <div class="row"><button class="btn press" style="flex:1;background:#fff" data-act="dropKey" ${gkey ? "" : "disabled"}>Quitar clave</button><button class="btn dark press" style="flex:1" data-act="saveKey">Guardar</button></div>
    <button class="btn press wide" style="background:#fff" data-act="closeModal">Cerrar</button>`),
  dropKey: () => { gkey = ""; gmodel = ""; store.set("gkey", ""); store.set("gmodel", ""); net(); closeModal(); toast("Clave quitada. IA apagada."); },
  saveKey: async el => {
    const v = $("#kInput").value.trim(), msg = $("#kMsg"); if (!v) { msg.innerHTML = "<strong>Pega primero tu clave.</strong>"; return; }
    $("#kInput").blur(); gkey = v; store.set("gkey", v); net(); const dk = document.querySelector('[data-act="dropKey"]'); if (dk) dk.disabled = false;
    if (!navigator.onLine){ msg.innerHTML = "<strong>Clave guardada.</strong> La probaré cuando haya internet."; toast("Clave guardada"); return; }
    el.disabled = true; msg.innerHTML = "<strong>Probando…</strong>";
    try { await gemini('Responde solo con este JSON: {"ok":true}'); msg.innerHTML = "<strong>Clave funcionando. IA activada.</strong>"; buzz(10); closeModal(); toast("Clave guardada. IA activada."); }
    catch(e){ const c = (e && e.code) || "red"; msg.innerHTML = "<strong>" + (c === "clave" ? "Esa clave no funcionó. Revisa que esté completa." : c === "limite" ? "La clave sirve, pero llegó al límite gratis por ahora." : "No pude probarla. Revisa tu conexión.") + "</strong>"; toast(c === "clave" ? "Esa clave no funcionó" : c === "limite" ? "Clave guardada, pero sin cupo gratis por ahora" : "Clave guardada, pero no pude probarla"); }
    el.disabled = false;
  },
  pdf: async el => {
    if (!window.jspdf){ toast("El PDF todavía no está listo. Abre la app una vez con internet."); return; }
    const sc = el.dataset.scope; let list, title;
    if (sc === "idea"){ const it = findIdea(sheetId); if (!it) return; list = [it]; title = it.nombre; }
    else if (sc === "folder"){ const f = folders.find(x => x.id === openFolder); if (!f || !f.ideas.length) return; list = f.ideas.slice().sort((a, b) => a.nivel - b.nivel); title = "Carpeta: " + f.name; }
    else if (sc === "saved"){ list = folders.filter(f => f.ideas.length).flatMap(f => [{h:`Carpeta: ${f.name}  ·  ${f.ideas.length} ${f.ideas.length === 1 ? "idea" : "ideas"}`}, ...f.ideas.slice().sort((a, b) => a.nivel - b.nivel)]); if (!list.length) return; title = "Mis ideas guardadas"; }
    else if (sc === "sel"){ if (!sel || !sel.size) return; list = [...sel].map(findIdea).filter(Boolean).sort((a, b) => a.nivel - b.nivel); if (!list.length) return; title = list.length === 1 ? list[0].nombre : "Ideas seleccionadas"; }
    else { if (!ideas.length) return; list = ideas; title = "Mis 10 ideas de negocio"; }
    const slug = title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "ideas";
    try { await deliverPDF(buildPDF(title, list), `fabrica-${slug}.pdf`); if (sc === "sel"){ sel = null; render(); } } catch(e){ toast("No se pudo crear el PDF"); }
  },
  selStart: () => { sel = new Set(); render(); toast("Toca las ideas que quieras exportar"); },
  selCancel: () => { sel = null; render(); },
  selToggle: el => {
    if (!sel) return; const id = el.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); buzz(8);
    document.querySelectorAll(`.selbtn[data-id="${id}"]`).forEach(b => b.setAttribute("aria-pressed", sel.has(id)));
    const g = $("#selGo"); if (g){ g.disabled = !sel.size; g.querySelector("span").textContent = sel.size ? `Exportar ${sel.size} en PDF` : "Toca las que quieras"; }
  },
  install: async () => {
    if (deferred){ deferred.prompt(); await deferred.userChoice; deferred = null; $("#installBtn").hidden = true; return; }
    openModal(`<h2>Instalar en tu teléfono</h2><p><strong>iPhone:</strong> en Safari toca Compartir y luego «Agregar a inicio».</p><p><strong>Android:</strong> en Chrome abre el menú de tres puntos y toca «Instalar app».</p><button class="btn dark press wide" data-act="closeModal">Entendido</button>`);
  }
};
function syncNext(){ const b = document.querySelector('[data-act="next"]'); if (b) b.disabled = !stepOk(step); }

document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; fn && fn(el, e); });
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.meta){ const n = parseInt(e.target.value.replace(/\D/g, "").slice(0, 9), 10) || 0; A.meta = n; e.target.value = n ? n.toLocaleString("es-MX") : ""; save(); return; }
  if (e.target.dataset && e.target.dataset.seed){ A.seed = e.target.value; save(); const b = document.querySelector('[data-act="genSeed"]'); if (b) b.disabled = !A.seed.trim(); return; }
  const k = e.target.dataset && e.target.dataset.note; if (k){ A.notes[k] = e.target.value; save(); syncNext(); } });
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".press"); if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--px", (e.clientX - r.left) + "px"); el.style.setProperty("--py", (e.clientY - r.top) + "px");
  el.classList.remove("glint"); void el.offsetWidth; el.classList.add("glint");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if ($("#modal").classList.contains("open")) closeModal(); else if (sheetId) closeSheet(); }
  if (e.key === "Enter" && e.target.id === "mInput" && modalSubmit) modalSubmit();
});

/*BOOT-START*/
/* ---------- conexión e instalación ---------- */
function net(){ const on = navigator.onLine; $("#dot").classList.toggle("off", !on); $("#net").textContent = on ? (gkey ? "IA activa" : "En línea") : "Sin conexión · todo funciona"; }
addEventListener("online", net); addEventListener("offline", net); net();
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (!standalone) $("#installBtn").hidden = false;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
addEventListener("appinstalled", () => { $("#installBtn").hidden = true; toast("App instalada"); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});

/*BOOT-END*/
if (ideas.length) tab = "ideas";
render();
</script>
</body>
</html>
